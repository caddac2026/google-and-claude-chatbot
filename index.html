<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Image Chatbot</h1>
            <p>Ask questions about images and text</p>
        </div>

        <div class="setup-panel" id="setupPanel">
            <h2>Setup</h2>
            <div class="form-group">
                <label for="apiProvider">Select AI Provider:</label>
                <select id="apiProvider">
                    <option value="gemini">Google Gemini</option>
                    <option value="claude">Anthropic Claude</option>
                </select>
            </div>
            <div class="form-group">
                <label for="apiKey">API Key:</label>
                <input type="password" id="apiKey" placeholder="Enter your API key">
            </div>
            <button id="saveConfig" class="btn btn-primary">Save Configuration</button>
            <p class="info-text">
                💡 Get API keys from:
                <a href="https://makersuite.google.com/app/apikey" target="_blank">Google Gemini</a> |
                <a href="https://console.anthropic.com/" target="_blank">Anthropic Claude</a>
            </p>
        </div>

        <div class="chat-container" id="chatContainer" style="display:none;">
            <div class="chat-messages" id="chatMessages"></div>

            <div class="input-area">
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*" multiple>
                    <label for="imageInput" class="file-label">📷 Add Images</label>
                </div>
                
                <div class="preview-container" id="previewContainer"></div>

                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Ask me anything about the images or any question..." rows="3"></textarea>
                    <button id="sendBtn" class="btn btn-send">Send</button>
                </div>
            </div>

            <div class="action-buttons">
                <button id="clearChat" class="btn btn-secondary">Clear Chat</button>
                <button id="logout" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
